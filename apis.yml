aid: zeroeyes
name: ZeroEyes
description: 'ZeroEyes is an AI-powered visual firearm detection company founded in
  2018 by former U.S. Navy SEALs and technologists after the Marjory Stoneman Douglas
  shooting, headquartered in Conshohocken, Pennsylvania. Its computer-vision platform
  layers onto a customer''s existing IP security cameras (any RTSP-capable camera,
  720p or better, 2017 or newer) to detect brandished firearms, and every AI detection
  is human-verified in the 24/7 ZeroEyes Operations Center (ZOC) before an alert carrying
  imagery, camera location, and a first-responder link is dispatched. The company sells
  into K-12 and higher education, commercial and industrial facilities, houses of worship,
  gaming, smart cities and transit, and federal government (ZeroEyes Federal / ZEGS),
  and complements detection with 3D site mapping and analytics. It holds FedRAMP Moderate
  authorization, SOC 2 Type 2, ISO/IEC 27001 certification, and a DHS SAFETY Act designation.
  ZeroEyes publishes no public developer API, OpenAPI definition, SDKs, or developer
  portal; integration is delivered through partner ecosystems (VMS, mass notification,
  mapping, robotics, RapidSOS, ATAK/iTAK) and camera RTSP streams rather than a self-serve
  API.'
